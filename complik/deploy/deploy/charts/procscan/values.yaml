# Image configuration
image:
  repository: ghcr.io/labring/procscan
  pullPolicy: IfNotPresent
  tag: "0.3.0"

# Procscan reports to the namespaced Admin service using explicit cluster DNS.
adminAuthSecretName: sealos-complik-procscan-auth

# Namespace
namespace: sealos

# ServiceAccount configuration
serviceAccount:
  create: true
  name: process-scanner
  automountServiceAccountToken: false

# RBAC configuration
rbac:
  create: true
  clusterRole:
    name: process-scanner
  clusterRoleBinding:
    name: process-scanner

# DaemonSet configuration
daemonset:
  name: proc-scan
  labels:
    app: proc-scan
    version: v1.0.0
  podLabels:
    app: process-scanner
    version: v1.0.0

  # Host network and PID
  hostNetwork: false
  hostPID: true
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    # containerd's host socket is commonly root:root 0660; retain the
    # supplemental group required for Unix-socket connect without running as root.
    supplementalGroups:
      - 0

  # Pod security context
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    supplementalGroups:
      - 0

  # Security context
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop:
        - ALL
      add:
        - SYS_PTRACE
        - DAC_READ_SEARCH

  # Resource limits
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 64Mi
      cpu: 50m

# Configuration file
config:
  scanner:
    proc_path: "/host/proc"
    scan_interval: "100s"
    rules_refresh_interval: "30s"
    health_port: 8081
    log_level: "info"

  notifications:
    admin:
      base_url: "http://sealos-complik-admin.sealos.svc.cluster.local:8080"
      timeout: "10s"
      basic_auth:
        username: "${ADMIN_BASIC_AUTH_USERNAME}"
        password: "${ADMIN_BASIC_AUTH_PASSWORD}"
        env:
          enabled: false
          secretName: sealos-complik-admin-auth
          usernameKey: username
          passwordKey: password

  metrics:
    enabled: false
    port: 8080
    path: "/metrics"

volumes:
  proc:
    hostPath: /proc
    mountPath: /host/proc
  containerdSock:
    hostPath: /var/run/containerd/containerd.sock
    mountPath: /var/run/containerd/containerd.sock
  config:
    mountPath: /config
