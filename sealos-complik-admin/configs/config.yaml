# Configuration file for the application

# Server settings
port: 8080

# Database settings
database:
  host: localhost
  port: 3306
  username: root
  password: "" # Set DB_PASSWORD through a Secret in deployed environments.
  name: sealos-complik-admin

auth:
  enabled: true
  username: "" # Set ADMIN_BASIC_AUTH_USERNAME through a Secret.
  password: "" # Set ADMIN_BASIC_AUTH_PASSWORD through a Secret.
  realm: CompliK Admin

procscan_auth:
  enabled: false

procscan_rules:
  v2_writes_enabled: false

oss:
  endpoint: oss-cn-hangzhou.aliyuncs.com
  bucket: your-bucket-name
  access_key_id: your-access-key-id
  access_key_secret: your-access-key-secret
  public_base_url: https://your-bucket-name.oss-cn-hangzhou.aliyuncs.com
  object_prefix: commitments
