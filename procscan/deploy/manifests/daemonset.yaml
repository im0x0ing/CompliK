# DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: block-procscan
  namespace: block-system
  labels:
    app: block-procscan
    component: security-scanner
    managed-by: block-procscan
spec:
  selector:
    matchLabels:
      app: block-procscan
      component: security-scanner
  template:
    metadata:
      labels:
        app: block-procscan
        component: security-scanner
        managed-by: block-procscan
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
          - 0
      hostNetwork: false
      hostPID: true
      serviceAccountName: block-procscan
      containers:
        - name: scanner
          image: docker.io/bearslyricattack/sealos-procscan
          imagePullPolicy: Always
          command: ["/manager"]
          args:
            - "--config=/config/config.yaml"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PROCSCAN_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sealos-complik-procscan-auth
                  key: username
            - name: PROCSCAN_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sealos-complik-procscan-auth
                  key: password
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
              add:
                - SYS_PTRACE
                - DAC_READ_SEARCH
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - mountPath: /var/run/containerd/containerd.sock
              name: containerd-sock
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 64Mi
              cpu: 50m
      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: config
          configMap:
            name: block-procscan-config
            defaultMode: 0644
        - hostPath:
            path: /var/run/containerd/containerd.sock
            type: Socket
          name: containerd-sock
